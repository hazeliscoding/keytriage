[package]
name = "keytriage-input"
description = "Foreground keyboard capture, starting with Windows Raw Input"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Features unify, so the app still compiles this crate once. tao and wry already build most of
# these; the device list adds the ones for opening a HID device and reading its container ID.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
