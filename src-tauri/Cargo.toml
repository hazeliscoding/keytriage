[package]
name = "keytriage"
description = "Diagnoses keyboard faults from evidence and guides the tests that isolate them"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "keytriage_lib"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
keytriage-diagnostics = { path = "../crates/diagnostics" }
keytriage-input = { path = "../crates/input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.0", features = [] }

# Tests replay the engine's synthetic streams through the session code. Dev-dependencies don't
# ship, so the fixtures stay out of the app.
[dev-dependencies]
keytriage-diagnostics = { path = "../crates/diagnostics", features = ["fixtures"] }

# The same versions tauri uses, so nothing compiles twice.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
