[package]
name = "keytriage"
description = "Diagnoses keyboard faults from evidence and guides the tests that isolate them"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "keytriage_lib"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
keytriage-input = { path = "../crates/input" }
tauri = { version = "2.12.0", features = [] }

# The same versions tauri uses, so nothing compiles twice.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
