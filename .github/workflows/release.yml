name: Release

# A vX.Y.Z tag on a commit on main drafts a GitHub release. A manual run is a dry run: it runs
# every check and prints the notes, and creates no tag, attestation or release. Publishing is the
# owner's.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions: {}

concurrency: release-${{ github.ref }}

jobs:
  version:
    name: Version and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A dry run checks the tag the version would get.
      - name: Check the versions against the tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then tag="$GITHUB_REF_NAME"; else tag="v$(node -p "require('./package.json').version")"; fi
          node scripts/check-release.mjs --tag "$tag"
      - name: Check that the commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Tag a commit on main."; exit 1; }

  # Tag pushes don't trigger CI, so the release reruns all of it on the tagged commit, and the
  # zip and the installer it drafts are the ones those checks passed.
  ci:
    name: CI
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The only job that can write, and it runs none of the repository's code.
  draft:
    name: Draft the release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: out
      # SHA256SUMS.txt lists the zip first, as the main download, then the installer.
      - name: Check the zip and the installer against their checksums
        working-directory: out
        run: |
          if [ "$(find . -mindepth 1 | wc -l)" -ne 3 ] || [ "$(wc -l < SHA256SUMS.txt)" -ne 2 ]; then
            echo "::error::The release artifact must hold the zip, the installer and their two SHA256SUMS.txt lines, not: $(find . -mindepth 1 -printf '%P ')"
            exit 1
          fi
          sha256sum -c SHA256SUMS.txt
          zip=$(sed -En '1s/^[0-9a-f]{64} [ *]//p' SHA256SUMS.txt)
          installer=$(sed -En '2s/^[0-9a-f]{64} [ *]//p' SHA256SUMS.txt)
          if [ "$GITHUB_EVENT_NAME" = push ]; then v="${GITHUB_REF_NAME#v}"; v="${v//./\\.}"; else v='[0-9]+\.[0-9]+\.[0-9]+'; fi
          if ! [[ "$zip" =~ ^keytriage_${v}_x64-portable\.zip$ && "$installer" =~ ^keytriage_${v}_x64-setup\.exe$ ]]; then
            echo "::error::$zip and $installer are not the zip and the installer for ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
      - name: Write the release notes
        run: |
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo '**Find out why your keyboard misbehaves, and what to try next.** keytriage tests your keyboard, shows the evidence, ranks the likely causes, and walks you through the test that tells them apart.'
            echo
            echo 'Tested on Windows 11 x64. Windows 10 should work but is untested, and there is no ARM64 build.'
            echo
            echo "**Portable:** download \`$ZIP\`, extract it, and run \`keytriage.exe\` in its \`keytriage\` folder. It keeps its data in \`keytriage-data\` beside the exe, so deleting the folder removes everything it wrote. Keep the folder somewhere you can write to, such as Downloads or Documents. It needs the WebView2 runtime, which Windows 11 includes, and says so where it is missing."
            echo
            echo "**Installer:** \`$INSTALLER\` installs for your user only, into %LOCALAPPDATA%\\keytriage, with no admin prompt, and runs Microsoft's WebView2 bootstrapper where the runtime is missing."
            echo
            echo "Neither is code-signed, so SmartScreen may warn before keytriage runs. Windows copies the zip's download mark to the files it extracts, so the warning shows for the extracted exe too. See [Install]($repo/blob/$GITHUB_SHA/README.md#install)."
            echo
            echo '## Check the download'
            echo
            echo "Compare each file with \`SHA256SUMS.txt\` before you run it. In PowerShell these print True:"
            echo
            echo '```powershell'
            for file in "$ZIP" "$INSTALLER"; do
              echo "(Get-FileHash .\\$file).Hash -eq ((Get-Content .\\SHA256SUMS.txt) -like '*$file').Split(' ')[0]"
            done
            echo '```'
            echo
            echo "\`certutil -hashfile $ZIP SHA256\` and \`sha256sum -c --ignore-missing SHA256SUMS.txt\` work too. To check that this repository's release workflow built a file, run \`gh attestation verify $ZIP --repo $GITHUB_REPOSITORY\`, or the same with the installer."
            echo
            echo '```text'
            cat out/SHA256SUMS.txt
            echo '```'
            echo
            echo "Built from $GITHUB_SHA by [this run]($repo/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "What keytriage keeps, what it never does, and what Windows' WebView2 runtime does on its own: [PRIVACY.md]($repo/blob/$GITHUB_SHA/PRIVACY.md)."
          } > notes.md
          cat notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Draft the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "out/$ZIP" "out/$INSTALLER" out/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "keytriage ${GITHUB_REF_NAME#v}" --notes-file notes.md
      - name: Say that a dry run made nothing
        if: github.event_name != 'push'
        run: echo 'Dry run. No attestation or release was made.' | tee -a "$GITHUB_STEP_SUMMARY"
