name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  network:
    name: Network guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: npm ci
      - name: Build the frontend for the bundle scan
        run: npm run build
      - name: Positive controls
        run: node --test scripts/check-network.test.mjs
      - name: Network guard
        run: node scripts/check-network.mjs --bundle

  capture:
    name: Capture guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Positive controls
        run: node --test scripts/check-capture.test.mjs
      - name: Capture guard
        run: node scripts/check-capture.mjs

  dependencies:
    name: Dependency guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Positive controls
        run: node --test scripts/check-dependencies.test.mjs
      - name: Dependency guard
        run: node scripts/check-dependencies.mjs

  release:
    name: Release checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Notices check's positive controls
        run: node --test scripts/check-notices.test.mjs
      - name: Release check's positive controls
        run: node --test scripts/check-release.test.mjs
      - name: Release check
        run: node scripts/check-release.mjs

  build:
    name: Build (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      # A tagged release compiles from scratch, never from a restored target/.
      - if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: npm test -- --watch=false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - name: Generate the Rust crates' notices
        shell: bash
        run: |
          mkdir -p target/notices
          cargo about generate --locked --fail -c scripts/notices/about.toml -m src-tauri/Cargo.toml -o target/notices/THIRD-PARTY-RUST.txt scripts/notices/about.hbs
      - name: Build the installer
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.release.conf.json -- --locked
      # The portable build is the exe the installer carries, the marker that keeps its data beside
      # it, and the installer's license files. The notices check compares them with the overlay.
      - name: Stage the portable folder
        shell: bash
        run: |
          portable=target/portable/keytriage
          rm -rf target/portable
          mkdir -p "$portable/licenses"
          cp target/release/keytriage.exe src-tauri/portable/keytriage.portable "$portable/"
          cp LICENSE "$portable/licenses/LICENSE.txt"
          cp dist/keytriage/3rdpartylicenses.txt "$portable/licenses/THIRD-PARTY-NPM.txt"
          cp target/notices/THIRD-PARTY-RUST.txt "$portable/licenses/THIRD-PARTY-RUST.txt"
      - name: Notices check
        run: node scripts/check-notices.mjs --portable target/portable/keytriage
      - name: Network guard on the shipped bundle
        run: node scripts/check-network.mjs --bundle
      # Git Bash writes LF line endings, which `sha256sum -c` needs. Each file is copied or zipped
      # by its exact name, so a stale one can't be picked up. .NET writes the zip's paths with
      # forward slashes, under the folder's own name.
      - name: Stage the portable zip, the installer and their checksums
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          zip="keytriage_${v}_x64-portable.zip"
          installer="keytriage_${v}_x64-setup.exe"
          rm -rf dist/release
          mkdir -p dist/release
          pwsh -NoProfile -Command "[IO.Compression.ZipFile]::CreateFromDirectory('target/portable/keytriage', 'dist/release/$zip', 'Optimal', \$true)"
          cp "target/release/bundle/nsis/$installer" dist/release/
          cd dist/release
          sha256sum "$zip" "$installer" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          echo "ZIP=dist/release/$zip" >> "$GITHUB_ENV"
          echo "INSTALLER=dist/release/$installer" >> "$GITHUB_ENV"
      - name: Release files check
        run: node scripts/check-release.mjs --artifact dist/release
      - name: Installer check
        run: pwsh -NoProfile -File scripts/check-installer.ps1 -Installer $env:INSTALLER
      - name: Installer check's Leftovers control
        run: |
          pwsh -NoProfile -File scripts/check-installer.ps1 -Installer $env:INSTALLER -PositiveControl Leftovers
          if ($LASTEXITCODE -eq 3) { exit 0 } else { exit 1 }
      - name: Installer check's DataFile control
        run: |
          pwsh -NoProfile -File scripts/check-installer.ps1 -Installer $env:INSTALLER -PositiveControl DataFile
          if ($LASTEXITCODE -eq 3) { exit 0 } else { exit 1 }
      - name: Connections check
        run: pwsh -NoProfile -File scripts/check-connections.ps1 -Exe target/release/keytriage.exe -Out dist/connections/connections.json
      - name: Connections check's positive control
        run: |
          pwsh -NoProfile -File scripts/check-connections.ps1 -PositiveControl
          if ($LASTEXITCODE -eq 3) { exit 0 } else { exit 1 }
      # Uploaded even when the check fails, so a caught connection can be read.
      - if: ${{ !cancelled() && hashFiles('dist/connections/connections.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: connections
          path: dist/connections/connections.json
          retention-days: 14
          if-no-files-found: error
      - name: Record the tool versions
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $webview2 = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv ?? 'not installed'
          @(
            '### Tool versions', '', '```text',
            (rustc --version), (cargo --version), "node $(node --version)", "npm $(npm --version)",
            (npx tauri --version), (cargo about --version), "WebView2 Runtime $webview2", '```'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/release
          retention-days: 14
          if-no-files-found: error
