<header class="header">
  <img class="header__lockup" [src]="lockup()" alt="keytriage" />
  <div class="steps">
    <span [class.steps__now]="step() === 1">01 Keyboard</span>
    <span>//</span>
    <span [class.steps__now]="step() === 2">02 Test</span>
    <span>//</span>
    <span [class.steps__now]="step() === 3">03 Findings</span>
  </div>
  <div class="header__end">
    @if (step() === 1) {
      <span class="header__context">{{ now() }}</span>
    } @else {
      <span class="header__context">{{ run.group()?.name }} · {{ run.group()?.id ?? '—' }}</span>
      <span>{{ run.size() }} {{ run.std() }}</span>
      <span>{{ run.boardName() }}</span>
    }
    <span class="header__capture" [class.header__capture--on]="run.screen() === 'test'">{{
      capture()
    }}</span>
    <button type="button" class="btn btn--ghost btn--sm" (click)="toggleTheme()">
      {{ theme() === 'dark' ? 'Light' : 'Dark' }}
    </button>
  </div>
</header>

@if (run.screen() === 'start' || run.screen() === 'starting') {
  <app-start-screen />
}
